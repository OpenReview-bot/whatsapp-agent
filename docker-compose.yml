services:
  whatsapp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATA_DIR=/app/data
      - AGENT_DASHBOARD_TOKEN=${AGENT_DASHBOARD_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - DATABASE_URL=${DATABASE_URL:-}
      - WHATSAPP_TRANSPORT=${WHATSAPP_TRANSPORT:-baileys}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
